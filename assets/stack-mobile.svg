<g>
  <rect x="48" y="166" width="324" height="58" rx="7" class="card" stroke-width="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="5.2s" begin="2.08s" repeatCount="indefinite"/></rect>
  <circle cx="20" cy="195" r="5" fill="#3fb950" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.2s" begin="2.08s" repeatCount="indefinite"/></circle>
