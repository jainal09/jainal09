<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="456" viewBox="0 0 390 456" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="none">
<title>Message flow from publishers through a NATS cluster to subscribers</title>
<style>
  .background{fill:#ffffff}.line{stroke:#8b949e}.muted{fill:#59636e}.blue{fill:#4c8eda}.primary{fill:#1f2328}
  @media (prefers-color-scheme: dark){.background{fill:#0d1117}.muted{fill:#8b949e}.primary{fill:#e6edf3}}
</style>
<text x="195" y="24" class="muted" font-size="14" text-anchor="middle">publishers</text>
<text x="195" y="125" fill="#3fb950" font-size="14" text-anchor="middle">NATS cluster</text>
<g class="line" stroke-width="1.5" opacity="0.45">
  <line x1="110" y1="58" x2="130" y2="165"/><line x1="280" y1="58" x2="260" y2="165"/>
  <line x1="130" y1="165" x2="260" y2="165"/><line x1="130" y1="165" x2="195" y2="245"/><line x1="260" y1="165" x2="195" y2="245"/>
  <line x1="195" y1="245" x2="110" y2="335"/><line x1="195" y1="245" x2="280" y2="335"/>
</g>
<path id="flow0" d="M110,58 L130,165" stroke="none"/><path id="flow1" d="M280,58 L260,165" stroke="none"/>
<path id="flow2" d="M130,165 L195,245" stroke="none"/><path id="flow3" d="M260,165 L195,245" stroke="none"/>
<path id="flow4" d="M195,245 L110,335" stroke="none"/><path id="flow5" d="M195,245 L280,335" stroke="none"/>
<g fill="#3fb950">
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#flow0" xlink:href="#flow0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#flow1" xlink:href="#flow1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="0.45s" repeatCount="indefinite"><mpath href="#flow2" xlink:href="#flow2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></circle>
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="1.55s" repeatCount="indefinite"><mpath href="#flow3" xlink:href="#flow3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.55s" repeatCount="indefinite"/></circle>
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#flow4" xlink:href="#flow4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle r="4" opacity="0"><animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite"><mpath href="#flow5" xlink:href="#flow5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.9s" repeatCount="indefinite"/></circle>
</g>
<rect x="137" y="288" width="116" height="25" rx="4" class="background"/>
<text x="195" y="305" class="muted" font-size="14" text-anchor="middle">subscribers</text>
<g fill="none" stroke-width="2.5">
  <circle cx="110" cy="58" r="10" stroke="#4c8eda"/><circle cx="280" cy="58" r="10" stroke="#4c8eda"/>
  <circle cx="110" cy="335" r="10" stroke="#4c8eda"/><circle cx="280" cy="335" r="10" stroke="#4c8eda"/>
  <circle cx="130" cy="165" r="14" stroke="#3fb950"><animate attributeName="r" values="14;17;14" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="165" r="14" stroke="#3fb950"><animate attributeName="r" values="14;17;14" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="195" cy="245" r="14" stroke="#3fb950"><animate attributeName="r" values="14;17;14" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
</g>
<text x="24" y="388" fill="#3fb950" font-size="18" font-weight="bold">5.0M msg/s</text>
<text x="24" y="412" class="muted" font-size="13">measured by knack on constrained hardware</text>
<text x="24" y="440" class="blue" font-size="13">shipped: nats-server 2.14.4 · nui 0.9.3</text>
</svg>
