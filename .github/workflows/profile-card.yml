name: Profile Card

on:
  schedule:
    # Once a day is plenty -- the underlying numbers move slowly and
    # raw.githubusercontent serves the committed SVG with max-age=300,
    # so a fresh commit is visible within five minutes either way.
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/generate_card.py
      - .github/workflows/profile-card.yml

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_card.py

      - name: Commit if the numbers moved
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- assets; then
            echo "No change in the rendered card."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile card"
          git push
