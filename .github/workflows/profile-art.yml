name: Profile Art

on:
  schedule:
    # trophies.svg carries live counts, so it genuinely goes stale. cluster.svg
    # and stack.svg are static and regenerate to identical bytes -- the commit
    # step below only pushes when something actually moved.
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/generate_art.py
      - .github/workflows/profile-art.yml

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render
        id: render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent until the Spotify secrets are added; the renderer falls back
          # to a "not connected" panel rather than failing the run.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 .github/scripts/generate_art.py

      - name: Open an issue when the Spotify token dies
        if: steps.render.outputs.spotify == 'expired'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Spotify refresh token expired"
        run: |
          set -euo pipefail
          # Only one open issue at a time, or this files a fresh one daily.
          if [ "$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')" != "0" ]; then
            echo "Issue already open."
            exit 0
          fi
          gh issue create --title "$TITLE" --body \
            'The music panel has reverted to "not connected".

          Spotify issues refresh tokens with a 180 day lifetime, so this is
          expected rather than a fault. A new one needs your consent in a
          browser, which cannot be automated.

          To fix: run `.github/scripts/spotify_auth.py` locally, then update
          the `SPOTIFY_REFRESH_TOKEN` repository secret.

          Everything else on the profile keeps rendering meanwhile.'

      - name: Commit if the numbers moved
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- assets; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile art"
          git push
